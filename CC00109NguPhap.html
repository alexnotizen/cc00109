<head>
<meta charset="UTF-8">

<title>BÀI 9 – NGỮ PHÁP - Flashcard</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; font-family: Arial, "Microsoft YaHei", sans-serif;
  background: #fdfbf7;
  display: flex; justify-content: center; color: #202124;
}
.app { width: min(874px, 98vw); padding: 20px 0 30px; }
h1 { text-align: center; margin: 0 0 10px; font-size: 32px; font-weight: bold; }
.progress { text-align: center; font-size: 18px; color: #444; margin-bottom: 15px; font-weight: bold; }
.card-wrap { perspective: 1200px; cursor: pointer; }
.card {
  width: 100%; height: 640px; position: relative; transform-style: preserve-3d;
  transition: transform .55s ease;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 24px; background: white; box-shadow: 0 15px 45px rgba(0,0,0,.15);
  display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
  padding: 30px; border: 3px solid #eee; overflow-y: auto;
}
.front { text-align: center; }
.back { transform: rotateY(180deg); text-align: left; align-items: flex-start; }

.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-blue-text { color: #2563eb; font-weight: bold; font-size: 1.2em; }
.hl-red { color: #dc2626; font-weight: bold; }
.pinyin { font-size: 1.584em; color: #555; margin-bottom: 10px; font-weight: 500; text-align: center; }

.zh-front { font-size: 2.16em; font-weight: bold; margin-bottom: 8px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }
.zh-back { color: #2563eb; font-weight: bold; font-size: 1.32em; }

.desc { font-size: 1.26em; color: #333; margin: 8px 0; text-align: left; width: 100%; line-height: 1.4; }
.front .desc { font-size: 1.512em; text-align: left; }
.controls { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
button {
  border: 0; border-radius: 20px; padding: 15px 28px; font-size: 18px;
  cursor: pointer; background: #e9eef7; color: #233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary { background: #2563eb; color: white; }
</style>
</head>

let idx = 0;
function render() {
  document.getElementById('frontFace').innerHTML = cards[idx].f;
  document.getElementById('backFace').innerHTML = cards[idx].b;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}
function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
function nextCard() { idx = (idx + 1) % cards.length; document.getElementById('card').classList.remove('flipped'); render(); }
function prevCard() { idx = (idx - 1 + cards.length) % cards.length; document.getElementById('card').classList.remove('flipped'); render(); }

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight') {
    nextCard();
  } else if (event.key === 'ArrowLeft') {
    prevCard();
  } else if (event.key === ' ' || event.key === 'ArrowUp' || event.key === 'ArrowDown') {
    event.preventDefault();
    flipCard();
  }
});

render();
</script>
